name: Release Linux Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Binary (Release Mode)
        run: cargo build --release

      - name: Archive Binary
        run: |
          cd target/release
          tar -czf shlt-linux-x86_64.tar.gz shlt
          mv shlt-linux-x86_64.tar.gz ../../

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: shlt-linux-x86_64.tar.gz
